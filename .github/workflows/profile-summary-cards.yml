name: Profile Summary Cards

on:
  schedule:
    - cron: "18 0 * * *"   # 每天 00:18 UTC（北京时间 08:18）自动更新
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: generate-profile-details-card
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards (not auto-pushed)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: zlyon
          BRANCH_NAME: "main"
          UTC_OFFSET: 8
          THEME: "tokyonight"
          AUTO_PUSH: false

      - name: Keep only profile-details card
        run: |
          mkdir -p cards
          cp profile-summary-card-output/tokyonight/0-profile-details.svg cards/profile-details.svg
          rm -rf profile-summary-card-output

      - name: Commit card
        uses: EndBug/add-and-commit@v9
        with:
          add: "cards/profile-details.svg"
          message: "update profile-details card"
          default_author: github_actions
