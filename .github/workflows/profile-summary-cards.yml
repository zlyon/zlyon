name: Profile Summary Cards

on:
  schedule:
    - cron: "18 0 * * *"   # 每天 00:18 UTC（北京时间 08:18）自动更新
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: zlyon
          BRANCH_NAME: "main"
          UTC_OFFSET: 8
          THEME: "tokyonight"
          AUTO_PUSH: true
